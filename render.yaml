# Render Blueprint - provisions the whole stack in one "New Blueprint" import:
# a Postgres database, the Express/Prisma API, and the Expo web build as a
# static site. See DEPLOY.md for the one-time manual steps (create the
# Render account, connect GitHub, import this blueprint).
#
# Free-tier notes (flagged here so they're not a surprise later):
#   - pestapp-db (free Postgres) expires 30 days after creation unless
#     upgraded to a paid plan. Fine for a review/demo period, not for
#     anything long-lived.
#   - pestapp-backend has no persistent disk on the free plan, so uploaded
#     photos/site-map images/PDF reports are stored on ephemeral local disk
#     and are lost whenever the service restarts or redeploys (including the
#     automatic spin-down after 15 min of inactivity on the free plan).
#     Upgrading pestapp-backend to a paid instance type unlocks attaching a
#     Render Disk for real persistence - ask if you want that wired in.
#   - pestapp-web (static site) is free on Render regardless of plan.

databases:
  - name: pestapp-db
    plan: free
    databaseName: pestapp
    user: pestapp

services:
  - type: web
    name: pestapp-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run prisma:generate -w backend
    # Shell/one-off jobs aren't available on Render's free plan, so the seed
    # runs on every boot instead of as a manual step - it's fully idempotent
    # (upserts / find-or-create throughout), so this is safe on every
    # restart, not just the first one.
    startCommand: npm run prisma:migrate:deploy -w backend && npm run seed -w backend && npm run start -w backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pestapp-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: ./storage
      - key: PORT
        value: 4000

  - type: web
    name: pestapp-web
    runtime: static
    rootDir: .
    # fromService's "host" property resolves to the bare service slug
    # (e.g. "pestapp-backend"), not the public "pestapp-backend.onrender.com"
    # hostname - that produced an unreachable https://pestapp-backend URL
    # baked into the build. Hardcoding the known public URL instead; update
    # this if pestapp-backend is ever renamed or given a custom domain.
    buildCommand: npm install && EXPO_PUBLIC_API_URL=https://pestapp-backend.onrender.com npm run build:web -w mobile
    staticPublishPath: mobile/dist
    # expo-sqlite's web backend needs the page to be cross-origin isolated
    # (SharedArrayBuffer) or openDatabaseSync() throws - without these,
    # isLocalDbAvailable() is always false on the deployed site, so every
    # screen that reads the offline cache (e.g. the New Inspection property
    # picker) silently shows "nothing cached" no matter what's in the
    # database. credentialless (not require-corp) so existing cross-origin
    # <Image> loads from pestapp-backend keep working without needing a
    # Cross-Origin-Resource-Policy header on every media response.
    headers:
      - path: /*
        headers:
          - name: Cross-Origin-Opener-Policy
            value: same-origin
          - name: Cross-Origin-Embedder-Policy
            value: credentialless
