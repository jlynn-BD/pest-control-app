# Render Blueprint - provisions the whole stack in one "New Blueprint" import:
# a Postgres database, the Express/Prisma API, and the Expo web build as a
# static site. See DEPLOY.md for the one-time manual steps (create the
# Render account, connect GitHub, import this blueprint).
#
# Plans (kept in step with what is actually paid for in the Render dashboard -
# this file is read on Blueprint syncs, so a stale plan here could push a
# resource back onto the free tier):
#   - pestapp-db is on the paid Basic-256mb plan (Render's "0.1c-256mb",
#     1 GB storage). The free Postgres tier expires 30 days after creation
#     and suspends the database, which took the whole API down once.
#   - pestapp-backend is on the paid Starter plan, so it no longer spins down
#     after 15 minutes idle.
#   - Uploaded photos/site-map images/PDF reports are still written to the
#     service's local disk, which is wiped on every restart or redeploy. The
#     paid plan now allows attaching a Render Disk for real persistence - not
#     wired in yet.
#   - pestapp-web (static site) is free on Render regardless of plan.

databases:
  - name: pestapp-db
    plan: basic-256mb
    diskSizeGB: 1
    databaseName: pestapp
    user: pestapp

services:
  - type: web
    name: pestapp-backend
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run prisma:generate -w backend
    # Shell/one-off jobs aren't available on Render's free plan, so the seed
    # runs on every boot instead of as a manual step - it's fully idempotent
    # (upserts / find-or-create throughout), so this is safe on every
    # restart, not just the first one.
    startCommand: npm run prisma:migrate:deploy -w backend && npm run seed -w backend && npm run start -w backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pestapp-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: ./storage
      - key: PORT
        value: 4000

  - type: web
    name: pestapp-web
    runtime: static
    rootDir: .
    # fromService's "host" property resolves to the bare service slug
    # (e.g. "pestapp-backend"), not the public "pestapp-backend.onrender.com"
    # hostname - that produced an unreachable https://pestapp-backend URL
    # baked into the build. Hardcoding the known public URL instead; update
    # this if pestapp-backend is ever renamed or given a custom domain.
    buildCommand: npm install && EXPO_PUBLIC_API_URL=https://pestapp-backend.onrender.com npm run build:web -w mobile
    staticPublishPath: mobile/dist
    # Without this, any direct hit on a deep route - a hard refresh while on
    # an inspection/site-map screen, a bookmark, someone pasting a link -
    # 404s instead of loading the app, since this is a client-side-routed
    # single-page app and Render has no reason to know /Inspections/SiteMap
    # isn't a real file. Static file requests (JS bundles, images) still
    # resolve to the actual file first; this only catches paths that don't
    # match one.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
